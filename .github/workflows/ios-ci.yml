name: ios-ci
on:
  push:
    paths: ["mobile/ios/**", "mobile/shared/**", ".github/workflows/ios-ci.yml"]
  pull_request:
    paths: ["mobile/ios/**", "mobile/shared/**", ".github/workflows/ios-ci.yml"]
concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile/ios
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Generate the Xcode project
        run: brew install xcodegen && xcodegen generate
      - name: Pick an available iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          phones = [(rt, x) for rt, xs in d.items() if 'iOS' in rt for x in xs if x['name'].startswith('iPhone')]
          phones.sort(key=lambda p: p[0])
          print(phones[-1][1]['udid'])")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$UDID"
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild -project ATLAS.xcodeproj -scheme ATLAS -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO test 2>&1 | tee test.log | tail -40
          grep -E "Test run with [0-9]+ tests" test.log
          python3 -c "
          import re
          log = open('test.log').read()
          m = re.search(r'Test run with (\d+) tests', log)
          n = int(m[1]) if m else 0
          print('tests', n)
          assert n >= 73, 'fewer iOS tests ran than expected'
          v = re.search(r'missed_lines vectors: 42 fixtures, (\d+) of (\d+) kept sets equal to the web reference', log)
          print(v[0] if v else 'missed_lines vector replay did not report')
          assert v and v[1] == v[2] == '753', 'the shared missed_lines vectors did not all run and pass'
          w = re.search(r'safety vectors: warning (\d+) of (\d+) equal to the web reference', log)
          print(w[0] if w else 'safety vector replay did not report')
          assert w and w[1] == w[2] and int(w[2]) > 100, 'the shared safety vectors did not all run and pass'
          g = re.search(r'safety vectors: when (\d+) of (\d+) equal to the web reference', log)
          print(g[0] if g else 'by-when vector replay did not report')
          assert g and g[1] == g[2] and int(g[2]) > 1000, 'the shared by-when vectors did not all run and pass'
          p = re.search(r'pip vectors: (\d+) of (\d+) equal to the web reference', log)
          print(p[0] if p else 'Pip vector replay did not report')
          assert p and p[1] == p[2] and int(p[2]) > 600, 'the shared Pip vectors did not all run and pass'"
