name: android-ci
on:
  push:
    paths: ["mobile/android/**", "mobile/shared/**", ".github/workflows/android-ci.yml"]
  pull_request:
    paths: ["mobile/android/**", "mobile/shared/**", ".github/workflows/android-ci.yml"]
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK location
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Unit tests and debug build
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Test report counts
        if: always()
        run: |
          python3 - <<'PY'
          import glob, re
          t = f = 0
          for x in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              h = open(x).read(600)
              m = re.search(r'tests="(\d+)".*?failures="(\d+)"', h, re.S)
              if m: t += int(m[1]); f += int(m[2])
          print(f"tests={t} failures={f}")
          assert t >= 24, "fewer unit tests ran than expected"
          PY
