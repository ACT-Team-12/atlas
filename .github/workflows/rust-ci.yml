name: rust-ci
on:
  push:
    branches: [main]
    paths:
      - "core/**"
      - "web/src/lib/verify.ts"
      - "web/src/lib/checkerTest.ts"
      - "web/src/lib/sample.ts"
      - "web/src/lib/sampleLabs.ts"
      - "web/src/data/eval/**"
      - "web/public/atlas_verify.wasm"
      - ".github/workflows/rust-ci.yml"
  pull_request:
    paths:
      - "core/**"
      - "web/src/lib/verify.ts"
      - "web/src/lib/checkerTest.ts"
      - "web/src/lib/sample.ts"
      - "web/src/lib/sampleLabs.ts"
      - "web/src/data/eval/**"
      - "web/public/atlas_verify.wasm"
      - ".github/workflows/rust-ci.yml"
concurrency:
  group: rust-ci-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true
jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/atlas-verify
    steps:
      - uses: actions/checkout@v4
      # Pinned: the committed pkg/atlas_verify.wasm is rebuilt below and must match byte for byte, which only holds
      # for the same rustc. build-wasm.sh refuses any other version. Bump this, rebuild pkg/ and commit together.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/atlas-verify
      # Pinned: Node 22.23.2 is on Unicode 17.0, the same as the Rust toolchain. parity.sh fails on any skew.
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --lib --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test
      # The committed package must agree with the TS checker, not just a fresh build.
      - name: Parity (committed pkg)
        run: ./parity.sh --wasm pkg/atlas_verify.wasm --out "$RUNNER_TEMP/parity-committed.json"
      - run: ./build-wasm.sh
      - name: Parity (fresh build)
        run: ./parity.sh
      - run: node js/demo.mjs
      # Proves the committed package came from this source (and that parity.json, which is deterministic, is current).
      - name: Committed pkg and parity.json match the fresh build
        run: git diff --exit-code -- pkg/atlas_verify.wasm pkg/atlas_verify.mjs parity.json
      # The browser downloads web/public/atlas_verify.wasm; it must be this exact build.
      - name: Web copy of the wasm is the committed build
        run: cmp pkg/atlas_verify.wasm ../../web/public/atlas_verify.wasm
