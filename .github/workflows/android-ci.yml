name: android-ci
on:
  push:
    branches: [main]
    paths: ["mobile/android/**", "mobile/shared/**", ".github/workflows/android-ci.yml"]
  pull_request:
    paths: ["mobile/android/**", "mobile/shared/**", ".github/workflows/android-ci.yml"]
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK location
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Unit tests and debug build
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Test report counts
        if: always()
        run: |
          python3 - <<'PY'
          import glob, re
          t = f = 0
          for x in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              h = open(x).read(600)
              m = re.search(r'tests="(\d+)".*?failures="(\d+)"', h, re.S)
              if m: t += int(m[1]); f += int(m[2])
          print(f"tests={t} failures={f}")
          assert t >= 79, "fewer unit tests ran than expected"
          # The shared safety vectors (warning pins, by-when groups, stop-now) must have run and passed.
          s = glob.glob("app/build/test-results/testDebugUnitTest/TEST-com.stephensookra.atlas.SafetyVectorsTest.xml")
          h = open(s[0]).read() if s else ""
          m = re.search(r'tests="(\d+)".*?failures="(\d+)".*?errors="(\d+)"', h, re.S)
          print("SafetyVectorsTest", m.groups() if m else "missing")
          assert m and int(m[1]) >= 6 and m[2] == "0" and m[3] == "0", "the shared safety vector replay did not run and pass"
          assert "safety vectors: when " in h and "safety vectors: warning " in h, "the safety vector replay did not report"
          # The shared Pip vectors (placement, the quiet rule, the fixed lines) must have run and passed.
          s = glob.glob("app/build/test-results/testDebugUnitTest/TEST-com.stephensookra.atlas.PipVectorsTest.xml")
          h = open(s[0]).read() if s else ""
          m = re.search(r'tests="(\d+)".*?failures="(\d+)".*?errors="(\d+)"', h, re.S)
          print("PipVectorsTest", m.groups() if m else "missing")
          assert m and int(m[1]) >= 8 and m[2] == "0" and m[3] == "0", "the shared Pip vector replay did not run and pass"
          r = re.search(r"pip vectors: (\d+) of (\d+) equal to the web reference", h)
          assert r and r[1] == r[2] and int(r[2]) > 600, "the Pip vector replay did not report"
          PY
