name: web-ci
on:
  push:
    paths: ["web/**", "mobile/shared/**", "mobile/ios/ATLASTests/Fixtures/extract_sample_live.json", ".github/workflows/web-ci.yml"]
  pull_request:
    paths: ["web/**", "mobile/shared/**", "mobile/ios/ATLASTests/Fixtures/extract_sample_live.json", ".github/workflows/web-ci.yml"]
concurrency:
  group: web-ci-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    # A throwaway Postgres so database tests (gated on these URLs) run in CI instead of skipping.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CALL_TEST_DATABASE_URL: postgres://atlas:atlas@localhost:5432/atlas_test
      TEST_DATABASE_URL: postgres://atlas:atlas@localhost:5432/atlas_test
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec next typegen
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      # The phone apps replay mobile/shared/missed-lines-vectors.json; regenerate it from this web code and fail on any
      # difference. Enforced on main and on pull requests into main (see the script for branches without PR 66).
      - name: Missed-lines vectors match the web reference
        env:
          ENFORCE: ${{ github.ref == 'refs/heads/main' || github.base_ref == 'main' }}
        run: bash ../mobile/shared/check-vectors.sh
      - run: pnpm build
