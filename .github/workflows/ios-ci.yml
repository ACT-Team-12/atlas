name: ios-ci
on:
  push:
    paths: ["mobile/ios/**", ".github/workflows/ios-ci.yml"]
  pull_request:
    paths: ["mobile/ios/**", ".github/workflows/ios-ci.yml"]
concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile/ios
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Generate the Xcode project
        run: brew install xcodegen && xcodegen generate
      - name: Pick an available iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          phones = [(rt, x) for rt, xs in d.items() if 'iOS' in rt for x in xs if x['name'].startswith('iPhone')]
          phones.sort(key=lambda p: p[0])
          print(phones[-1][1]['udid'])")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$UDID"
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild -project ATLAS.xcodeproj -scheme ATLAS -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO test 2>&1 | tee test.log | tail -40
          grep -E "Test run with [0-9]+ tests" test.log
          python3 -c "
          import re
          m = re.search(r'Test run with (\d+) tests', open('test.log').read())
          n = int(m[1]) if m else 0
          print('tests', n)
          assert n >= 16, 'fewer iOS tests ran than expected'"
